# gitleaks usa sus reglas por defecto; solo se permiten los valores de prueba de las pruebas unitarias.
[extend]
useDefault = true

[allowlist]
description = "Valores falsos usados por las pruebas de la API y token revocado"
paths = ['''api/src/test/.*''']
stopwords = ['''Zx9Qm4Lp8Rt2Vw7Yb3Nc5Hd6Jf1Ks0Ga''']
